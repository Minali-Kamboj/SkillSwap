<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Join SkillSwap</title><link rel="stylesheet" href="/css/style.css"></head>
<body class="auth-bg"><nav class="navbar"><a class="brand" href="/">Skill<span>Swap</span></a><a href="/login.html">Log in</a></nav>
<main class="auth-wrap"><form id="registerForm" class="auth-card"><span class="eyebrow">GET STARTED</span><h1>Create your account</h1><p class="muted">Meet people who can teach and learn with you.</p>
<label>Full name<input name="name" required placeholder="Your name"></label><label>Email<input name="email" type="email" required placeholder="you@example.com"></label><label>Password<input name="password" type="password" minlength="6" required placeholder="At least 6 characters"></label><label>University<input name="university" placeholder="Your university"></label><label>Country<input name="country" value="India"></label><button class="btn full">Create account</button><p id="message" class="message"></p><p class="auth-switch">Already registered? <a href="/login.html">Log in</a></p></form></main><script src="/js/auth.js"></script></body></html>
